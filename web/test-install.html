<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PBW Install Test Harness</title>
    <script src="jszip.min.js"></script>
    <style>
        body { background: #1a1a2e; color: #0f0; font-family: monospace; padding: 20px; font-size: 13px; }
        #log { white-space: pre-wrap; max-height: 90vh; overflow-y: auto; }
        h2 { color: #4cc9f0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>PBW Install Test Harness</h2>
    <div id="log"></div>
    <canvas id="canvas" width="200" height="228" style="border: 2px solid #333; border-radius: 8px; image-rendering: pixelated; margin-bottom: 10px;"></canvas>

    <script>
        var logEl = document.getElementById('log');
        function log(msg) {
            var line = new Date().toTimeString().slice(0,8) + '.' +
                String(new Date().getMilliseconds()).padStart(3,'0') + ' ' + msg;
            console.log(line);
            logEl.textContent += line + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ================================================================
        // Boot QEMU
        // ================================================================
        var runtimeReady = false;
        var Module = {
            canvas: document.getElementById('canvas'),
            noInitialRun: false,
            arguments: [
                '-machine', 'pebble-snowy-emery-bb',
                '-display', 'none',
                '-monitor', 'none',
                '-parallel', 'none',
                '-kernel', '/firmware/qemu_micro_flash.bin',
                '-drive', 'if=none,id=spi-flash,file=/firmware/qemu_spi_flash.bin,format=raw',
                '-serial', 'null',
                '-serial', 'null',
                '-serial', 'null',
            ],
            print: function(text) { log('[stdout] ' + text); },
            printErr: function(text) {
                // Show all QEMU stderr for debugging
                if (text && text.length > 0 && text.indexOf('...') !== 0) {
                    log('[QEMU] ' + text);
                }
            },
            onRuntimeInitialized: function() {
                log('[boot] QEMU runtime initialized');
                runtimeReady = true;
            },
            locateFile: function(path) { return path; },
            preRun: [],
        };

        async function fetchBin(url, label) {
            var resp = await fetch(url);
            if (!resp.ok) throw new Error(label + ': HTTP ' + resp.status);
            var buf = await resp.arrayBuffer();
            log('[boot] ' + label + ': ' + buf.byteLength + ' bytes');
            return new Uint8Array(buf);
        }

        async function boot() {
            log('[boot] Fetching firmware...');
            var fwBase = 'firmware/sdk/';
            var microData = await fetchBin(fwBase + 'qemu_micro_flash.bin', 'micro_flash');
            var spiData = await fetchBin(fwBase + 'qemu_spi_flash.bin', 'spi_flash');

            Module.preRun.push(function() {
                try { FS.mkdir('/firmware'); } catch(e) {}
                try { FS.mkdir('/tmp'); } catch(e) {}
                var offsetSec = -new Date().getTimezoneOffset() * 60;
                ENV.TZ_OFFSET_SEC = String(offsetSec);
                FS.writeFile('/firmware/qemu_micro_flash.bin', microData);
                FS.writeFile('/firmware/qemu_spi_flash.bin', spiData);
            });

            log('[boot] Loading QEMU WASM module...');
            var script = document.createElement('script');
            script.src = 'qemu-system-arm.js';
            document.body.appendChild(script);
        }

        // ================================================================
        // Ring Buffer
        // ================================================================
        var RING_SIZE = 16384;
        var RING_MASK = RING_SIZE - 1;
        var jsToQemuAddr = 0;
        var qemuToJsAddr = 0;

        function ringWrite(addr, data) {
            var hIdx = addr >> 2, tIdx = (addr + 4) >> 2, base = addr + 8;
            var h = Atomics.load(Module.HEAPU32, hIdx);
            var t = Atomics.load(Module.HEAPU32, tIdx);
            var free = RING_MASK - ((h - t) & RING_MASK);
            var n = Math.min(free, data.length);
            for (var i = 0; i < n; i++) {
                Module.HEAPU8[base + ((h + i) & RING_MASK)] = data[i];
            }
            if (n > 0) Atomics.store(Module.HEAPU32, hIdx, (h + n) & RING_MASK);
            return n;
        }

        function ringRead(addr, maxLen) {
            var hIdx = addr >> 2, tIdx = (addr + 4) >> 2, base = addr + 8;
            var h = Atomics.load(Module.HEAPU32, hIdx);
            var t = Atomics.load(Module.HEAPU32, tIdx);
            var avail = (h - t) & RING_MASK;
            var n = Math.min(avail, maxLen);
            if (n === 0) return null;
            var buf = new Uint8Array(n);
            for (var i = 0; i < n; i++) {
                buf[i] = Module.HEAPU8[base + ((t + i) & RING_MASK)];
            }
            Atomics.store(Module.HEAPU32, tIdx, (t + n) & RING_MASK);
            return buf;
        }

        async function ringWriteAll(addr, data) {
            var off = 0;
            while (off < data.length) {
                var n = ringWrite(addr, data.subarray(off));
                off += n;
                if (off < data.length) await new Promise(function(r) { setTimeout(r, 5); });
            }
            // Debug: verify ring state after write
            var hIdx = addr >> 2, tIdx = (addr + 4) >> 2;
            var h = Atomics.load(Module.HEAPU32, hIdx);
            var t = Atomics.load(Module.HEAPU32, tIdx);
            log('[ring] writeAll done: ' + data.length + ' bytes, ring h=' + h + ' t=' + t +
                ' avail=' + ((h - t) & RING_MASK));
        }

        // ================================================================
        // Protocol helpers
        // ================================================================
        function hexdump(data, max) {
            max = max || 64;
            var s = '';
            for (var i = 0; i < Math.min(data.length, max); i++) {
                s += data[i].toString(16).padStart(2, '0') + ' ';
            }
            if (data.length > max) s += '...';
            return s.trim();
        }

        function buildQemuPacket(protocol, payload) {
            var frame = new Uint8Array(8 + payload.length);
            var dv = new DataView(frame.buffer);
            dv.setUint16(0, 0xFEED);
            dv.setUint16(2, protocol);
            dv.setUint16(4, payload.length);
            frame.set(payload, 6);
            dv.setUint16(6 + payload.length, 0xBEEF);
            return frame;
        }

        function buildPebbleProtocol(endpoint, data) {
            var pp = new Uint8Array(4 + data.length);
            var dv = new DataView(pp.buffer);
            dv.setUint16(0, data.length);
            dv.setUint16(2, endpoint);
            pp.set(data, 4);
            return pp;
        }

        async function sendPebbleMessage(endpoint, data) {
            if (!(data instanceof Uint8Array)) data = new Uint8Array(data);
            var pp = buildPebbleProtocol(endpoint, data);
            var frame = buildQemuPacket(1, pp);
            log('[TX] endpoint=0x' + endpoint.toString(16) + ' len=' + data.length +
                ' frame=' + hexdump(frame, 32));
            await ringWriteAll(jsToQemuAddr, frame);
        }

        // PhoneVersionResponse — must reply to PhoneVersionRequest or firmware
        // won't know a phone is connected and won't send AppFetchRequest
        var phoneVersionSent = false;
        function buildPhoneVersionResponse() {
            var buf = new Uint8Array(25);
            var dv = new DataView(buf.buffer);
            buf[0] = 0x01;                        // kind = Response
            dv.setUint32(1, 0xFFFFFFFF, false);    // protocol_version
            dv.setUint32(5, 0x80000000, false);    // session_caps (GAMMA_RAY)
            dv.setUint32(9, 50, false);            // platform_flags
            buf[13] = 2;                           // response_version
            buf[14] = 3;                           // major
            buf[15] = 0;                           // minor
            buf[16] = 0;                           // bugfix
            dv.setUint32(17, 0xFFFFFFFF, false);   // protocol_caps high
            dv.setUint32(21, 0xFFFFFFFF, false);   // protocol_caps low
            return buf;
        }

        // Response parsing with verbose logging
        var responseBuffer = new Uint8Array(0);
        var pendingMessages = [];

        function pollResponses() {
            var chunk = ringRead(qemuToJsAddr, 8192);
            if (!chunk) return;

            log('[RX raw] ' + chunk.length + ' bytes: ' + hexdump(chunk, 48));

            var combined = new Uint8Array(responseBuffer.length + chunk.length);
            combined.set(responseBuffer);
            combined.set(chunk, responseBuffer.length);
            responseBuffer = combined;

            while (responseBuffer.length >= 8) {
                var dv = new DataView(responseBuffer.buffer,
                    responseBuffer.byteOffset, responseBuffer.byteLength);
                if (dv.getUint16(0) !== 0xFEED) {
                    log('[RX] skipping non-FEED byte: 0x' +
                        responseBuffer[0].toString(16).padStart(2, '0'));
                    responseBuffer = responseBuffer.slice(2);
                    continue;
                }
                var proto = dv.getUint16(2);
                var dataLen = dv.getUint16(4);
                var totalSize = 6 + dataLen + 2;
                if (responseBuffer.length < totalSize) break;

                if (dv.getUint16(6 + dataLen) !== 0xBEEF) {
                    log('[RX] bad footer at offset ' + (6 + dataLen));
                    responseBuffer = responseBuffer.slice(2);
                    continue;
                }

                var data = responseBuffer.slice(6, 6 + dataLen);
                responseBuffer = responseBuffer.slice(totalSize);

                log('[RX frame] proto=' + proto + ' len=' + dataLen +
                    ' data=' + hexdump(data, 48));

                if (proto === 1 && data.length >= 4) {
                    // Parse ALL PP messages from this SPP frame (firmware may batch multiple)
                    var ppOff = 0;
                    while (ppOff + 4 <= data.length) {
                        var ppDv = new DataView(data.buffer, data.byteOffset + ppOff, data.byteLength - ppOff);
                        var ppLen = ppDv.getUint16(0);
                        var ppEndpoint = ppDv.getUint16(2);
                        if (ppOff + 4 + ppLen > data.length) break;
                        var ppPayload = data.slice(ppOff + 4, ppOff + 4 + ppLen);
                        ppOff += 4 + ppLen;
                        log('[RX PP] endpoint=0x' + ppEndpoint.toString(16) +
                            ' ppLen=' + ppLen + ' payload=' + hexdump(ppPayload, 32));

                        // Auto-respond to PhoneVersionRequest (endpoint 0x11, cmd 0x00)
                        if (ppEndpoint === 0x11 && ppPayload.length >= 1 &&
                            ppPayload[0] === 0x00 && !phoneVersionSent) {
                            phoneVersionSent = true;
                            log('[serial] PhoneVersionRequest received, sending response');
                            sendPebbleMessage(0x11, buildPhoneVersionResponse());
                            continue;
                        }

                        // Auto-respond to PingPong Ping (endpoint 0x07d1, cmd 0x00)
                        if (ppEndpoint === 0x07d1 && ppPayload.length >= 5 &&
                            ppPayload[0] === 0x00) {
                            var pong = new Uint8Array(5);
                            pong[0] = 0x01; // Pong
                            pong.set(ppPayload.slice(1, 5), 1); // echo cookie
                            log('[serial] Ping received, sending Pong');
                            sendPebbleMessage(0x07d1, pong);
                            continue;
                        }

                        pendingMessages.push({ endpoint: ppEndpoint, data: ppPayload });
                    }
                }
            }
        }

        async function waitForResponse(endpoint, timeoutMs) {
            var deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                pollResponses();
                for (var i = 0; i < pendingMessages.length; i++) {
                    if (pendingMessages[i].endpoint === endpoint) {
                        return pendingMessages.splice(i, 1)[0].data;
                    }
                }
                await new Promise(function(r) { setTimeout(r, 50); });
            }
            log('[RX] pending messages at timeout: ' + pendingMessages.length);
            for (var i = 0; i < pendingMessages.length; i++) {
                log('[RX]   pending: endpoint=0x' + pendingMessages[i].endpoint.toString(16) +
                    ' data=' + hexdump(pendingMessages[i].data, 32));
            }
            throw new Error('Timeout waiting for endpoint 0x' + endpoint.toString(16));
        }

        // Continuously poll responses even when not waiting for specific one
        var bgPollInterval;
        function startBackgroundPoll() {
            bgPollInterval = setInterval(function() {
                pollResponses();
            }, 100);
        }

        // ================================================================
        // STM32 CRC32
        // ================================================================
        function stm32Crc32(data) {
            var padLen = Math.ceil(data.length / 4) * 4;
            var padded = new Uint8Array(padLen);
            padded.set(data);
            var dv = new DataView(padded.buffer);
            var crc = 0xFFFFFFFF;
            for (var i = 0; i < padLen; i += 4) {
                crc = (crc ^ dv.getUint32(i, true)) >>> 0;
                for (var j = 0; j < 32; j++) {
                    if (crc & 0x80000000) {
                        crc = ((crc << 1) ^ 0x04C11DB7) >>> 0;
                    } else {
                        crc = (crc << 1) >>> 0;
                    }
                }
            }
            return crc >>> 0;
        }

        // ================================================================
        // PBW Parser
        // ================================================================
        async function parsePBW(data) {
            var zip = await JSZip.loadAsync(data);
            log('[pbw] Files in PBW: ' + Object.keys(zip.files).join(', '));

            var prefixes = ['emery/', 'basalt/', ''];
            var manifest = null, prefix = '';
            for (var p = 0; p < prefixes.length; p++) {
                var mf = zip.file(prefixes[p] + 'manifest.json');
                if (mf) {
                    manifest = JSON.parse(await mf.async('string'));
                    prefix = prefixes[p];
                    break;
                }
            }
            if (!manifest) throw new Error('No manifest.json');
            log('[pbw] Manifest: ' + JSON.stringify(manifest, null, 2));

            var appInfo = manifest.application || manifest.firmware;
            var appBinPath = prefix + (appInfo.name || 'pebble-app.bin');
            var appBinary = await zip.file(appBinPath).async('uint8array');

            var hdr = new DataView(appBinary.buffer, appBinary.byteOffset, appBinary.byteLength);
            var uuid = appBinary.slice(104, 120);
            var nameBytes = appBinary.slice(24, 56);
            var name = '';
            for (var i = 0; i < 32 && nameBytes[i] !== 0; i++) name += String.fromCharCode(nameBytes[i]);

            log('[pbw] Binary header hex (first 120 bytes): ' + hexdump(appBinary.slice(0, 120), 120));
            log('[pbw] Name: "' + name + '"');
            log('[pbw] UUID bytes: ' + hexdump(uuid, 16));
            log('[pbw] Flags: 0x' + hdr.getUint32(96, true).toString(16));
            log('[pbw] Icon: ' + hdr.getUint32(88, true));

            var result = {
                uuid: uuid, name: name,
                flags: hdr.getUint32(96, true),
                icon: hdr.getUint32(88, true),
                appVersionMajor: appBinary[12],
                appVersionMinor: appBinary[13],
                sdkVersionMajor: appBinary[10],
                sdkVersionMinor: appBinary[11],
                binary: appBinary, resources: null, worker: null,
            };

            if (manifest.resources) {
                var resFile = zip.file(prefix + manifest.resources.name);
                if (resFile) result.resources = await resFile.async('uint8array');
            }
            if (manifest.worker) {
                var wkFile = zip.file(prefix + manifest.worker.name);
                if (wkFile) result.worker = await wkFile.async('uint8array');
            }

            return result;
        }

        // ================================================================
        // Install flow
        // ================================================================
        function buildAppMetadata(info) {
            var meta = new Uint8Array(126);
            var dv = new DataView(meta.buffer);
            meta.set(info.uuid, 0);
            dv.setUint32(16, info.flags, true);
            dv.setUint32(20, info.icon, true);
            meta[24] = info.appVersionMajor;
            meta[25] = info.appVersionMinor;
            meta[26] = info.sdkVersionMajor;
            meta[27] = info.sdkVersionMinor;
            for (var i = 0; i < Math.min(info.name.length, 95); i++) {
                meta[30 + i] = info.name.charCodeAt(i);
            }
            return meta;
        }

        function buildBlobDBInsert(token, uuid, value) {
            var buf = new Uint8Array(23 + value.length);
            var dv = new DataView(buf.buffer);
            buf[0] = 0x01;
            dv.setUint16(1, token, true);
            buf[3] = 0x02;
            buf[4] = 16;
            buf.set(uuid, 5);
            dv.setUint16(21, value.length, true);
            buf.set(value, 23);
            return buf;
        }

        async function putBytesTransfer(data, objectType, appId, label) {
            log('[putbytes] ' + label + ': ' + data.length + ' bytes, type=0x' +
                objectType.toString(16) + ', appId=' + appId);

            var initBuf = new Uint8Array(10);
            var initDv = new DataView(initBuf.buffer);
            initBuf[0] = 0x01;
            initDv.setUint32(1, data.length, false);
            initBuf[5] = objectType;
            initDv.setUint32(6, appId, false);
            await sendPebbleMessage(0xBEEF, initBuf);

            var initResp = await waitForResponse(0xBEEF, 15000);
            if (initResp[0] !== 0x01) throw new Error('PutBytes init NACK');
            var cookie = new DataView(initResp.buffer, initResp.byteOffset,
                initResp.byteLength).getUint32(1, false);
            log('[putbytes] cookie=' + cookie);

            var CHUNK = 2000, sent = 0;
            while (sent < data.length) {
                var len = Math.min(CHUNK, data.length - sent);
                var putBuf = new Uint8Array(9 + len);
                var putDv = new DataView(putBuf.buffer);
                putBuf[0] = 0x02;
                putDv.setUint32(1, cookie, false);
                putDv.setUint32(5, len, false);
                putBuf.set(data.subarray(sent, sent + len), 9);
                await sendPebbleMessage(0xBEEF, putBuf);

                var putResp = await waitForResponse(0xBEEF, 15000);
                if (putResp[0] !== 0x01) throw new Error('PutBytes put NACK at ' + sent);
                sent += len;
                log('[putbytes] ' + label + ': ' + sent + '/' + data.length);
            }

            var crc = stm32Crc32(data);
            var commitBuf = new Uint8Array(9);
            var commitDv = new DataView(commitBuf.buffer);
            commitBuf[0] = 0x03;
            commitDv.setUint32(1, cookie, false);
            commitDv.setUint32(5, crc, false);
            await sendPebbleMessage(0xBEEF, commitBuf);
            var commitResp = await waitForResponse(0xBEEF, 15000);
            if (commitResp[0] !== 0x01) throw new Error('PutBytes commit NACK');
            log('[putbytes] ' + label + ' committed CRC=0x' + crc.toString(16));

            var installBuf = new Uint8Array(5);
            var installDv = new DataView(installBuf.buffer);
            installBuf[0] = 0x05;
            installDv.setUint32(1, cookie, false);
            await sendPebbleMessage(0xBEEF, installBuf);
            var installResp = await waitForResponse(0xBEEF, 15000);
            if (installResp[0] !== 0x01) throw new Error('PutBytes install NACK');
            log('[putbytes] ' + label + ' installed');
        }

        async function installPBW() {
            log('[install] Fetching test PBW...');
            var resp = await fetch('test-app.pbw');
            var pbwData = await resp.arrayBuffer();
            log('[install] PBW size: ' + pbwData.byteLength);

            var pbw = await parsePBW(pbwData);
            var uuidHex = Array.from(pbw.uuid).map(function(b) {
                return b.toString(16).padStart(2, '0');
            }).join('');
            log('[install] App: "' + pbw.name + '" UUID=' + uuidHex);
            log('[install] Binary: ' + pbw.binary.length +
                (pbw.resources ? ', Resources: ' + pbw.resources.length : '') +
                (pbw.worker ? ', Worker: ' + pbw.worker.length : ''));

            // 1. BlobDB Insert
            log('[install] === Step 1: BlobDB Insert ===');
            var token = (Math.random() * 65534 + 1) | 0;
            var metadata = buildAppMetadata(pbw);
            log('[install] Metadata (' + metadata.length + ' bytes): ' + hexdump(metadata, 48));
            var blobCmd = buildBlobDBInsert(token, pbw.uuid, metadata);
            log('[install] BlobDB cmd (' + blobCmd.length + ' bytes): ' + hexdump(blobCmd, 48));
            await sendPebbleMessage(0xb1db, blobCmd);

            var blobResp = await waitForResponse(0xb1db, 10000);
            log('[install] BlobDB response: ' + hexdump(blobResp, 16));
            if (blobResp[2] !== 0x01) throw new Error('BlobDB insert failed: ' + blobResp[2]);
            log('[install] BlobDB OK');

            // Small delay to let firmware commit BlobDB write
            await new Promise(function(r) { setTimeout(r, 1000); });

            // 2. AppRunState Start
            log('[install] === Step 2: AppRunState Start ===');
            var runCmd = new Uint8Array(17);
            runCmd[0] = 0x01;
            runCmd.set(pbw.uuid, 1);
            await sendPebbleMessage(0x34, runCmd);

            // 3. Wait for AppFetchRequest (with extra long timeout and logging)
            log('[install] === Step 3: Waiting for AppFetchRequest (0x1771) ===');
            log('[install] Polling for responses... (60s timeout)');
            var fetchReq = await waitForResponse(0x1771, 60000);
            var fetchDv = new DataView(fetchReq.buffer, fetchReq.byteOffset, fetchReq.byteLength);
            var appId = fetchDv.getUint32(17, true);
            log('[install] AppFetchRequest! app_id=' + appId);

            // 4. AppFetchResponse
            log('[install] === Step 4: AppFetchResponse ===');
            var fetchResp = new Uint8Array(2);
            fetchResp[0] = 0x01;
            fetchResp[1] = 0x01;
            await sendPebbleMessage(0x1771, fetchResp);

            // 5. PutBytes
            log('[install] === Step 5: PutBytes binary ===');
            await putBytesTransfer(pbw.binary, 0x85, appId, 'binary');
            if (pbw.resources) {
                log('[install] === Step 6: PutBytes resources ===');
                await putBytesTransfer(pbw.resources, 0x84, appId, 'resources');
            }
            if (pbw.worker) {
                log('[install] === Step 7: PutBytes worker ===');
                await putBytesTransfer(pbw.worker, 0x87, appId, 'worker');
            }

            log('[install] === INSTALL COMPLETE ===');
        }

        // ================================================================
        // Main: boot, wait, install
        // ================================================================
        async function main() {
            await boot();

            // Wait for runtime
            log('[main] Waiting for QEMU runtime...');
            while (!runtimeReady) await new Promise(function(r) { setTimeout(r, 500); });

            // Init ring buffers
            log('[main] Waiting for ring buffer exports...');
            while (true) {
                try {
                    if (Module._pebble_serial_js_to_qemu_addr) {
                        jsToQemuAddr = Module._pebble_serial_js_to_qemu_addr();
                        qemuToJsAddr = Module._pebble_serial_qemu_to_js_addr();
                        if (jsToQemuAddr && qemuToJsAddr) {
                            log('[main] Ring buffers: js->qemu=0x' + jsToQemuAddr.toString(16) +
                                ', qemu->js=0x' + qemuToJsAddr.toString(16));
                            break;
                        }
                    }
                } catch(e) {}
                await new Promise(function(r) { setTimeout(r, 1000); });
            }

            // Start background polling to catch any unsolicited messages
            startBackgroundPoll();

            // Start display render loop
            var canvasCtx = document.getElementById('canvas').getContext('2d');
            var lastFrameCount = 0;
            var cachedImgData = null;
            setInterval(function() {
                try {
                    var fc = Module._pebble_display_frame_count();
                    if (fc === lastFrameCount) return;
                    lastFrameCount = fc;
                    var width = Module._pebble_display_width();
                    var height = Module._pebble_display_height();
                    var stride = Module._pebble_display_stride();
                    var dataPtr = Module._pebble_display_data();
                    if (!dataPtr || !width || !height) return;
                    if (!cachedImgData || cachedImgData.width !== width || cachedImgData.height !== height) {
                        cachedImgData = canvasCtx.createImageData(width, height);
                    }
                    var dst32 = new Uint32Array(cachedImgData.data.buffer);
                    var heap = Module.HEAPU8;
                    for (var y = 0; y < height; y++) {
                        var rowSrc = dataPtr + y * stride;
                        var rowDst = y * width;
                        for (var x = 0; x < width; x++) {
                            var s = rowSrc + x * 4;
                            dst32[rowDst + x] = heap[s+2] | (heap[s+1] << 8) | (heap[s] << 16) | 0xFF000000;
                        }
                    }
                    canvasCtx.putImageData(cachedImgData, 0, 0);
                } catch(e) {}
            }, 100);

            // Wait for firmware to boot (watch for frames)
            log('[main] Waiting for firmware to boot (watching for display frames)...');
            var frameCount = 0;
            while (true) {
                try {
                    var fc = Module._pebble_display_frame_count();
                    if (fc > 10) {
                        log('[main] Display active: ' + fc + ' frames rendered');
                        break;
                    }
                    if (fc > frameCount) {
                        frameCount = fc;
                        log('[main] Frame count: ' + fc);
                    }
                } catch(e) {}
                await new Promise(function(r) { setTimeout(r, 2000); });
            }

            // Send WatchVersionRequest (endpoint 0x10, cmd 0x00) — pebble-tool does this
            // before any install, and blocks until response. Firmware may need this.
            log('[main] Sending WatchVersionRequest...');
            await sendPebbleMessage(0x10, new Uint8Array([0x00]));
            try {
                var watchVer = await waitForResponse(0x10, 10000);
                log('[main] WatchVersionResponse: ' + watchVer.length + ' bytes');
            } catch(e) {
                log('[main] WatchVersionResponse timeout (continuing anyway)');
            }

            // Wait for firmware services
            log('[main] Waiting 3s for firmware services...');
            await new Promise(function(r) { setTimeout(r, 3000); });

            // Install
            try {
                await installPBW();
            } catch(e) {
                log('[install] ERROR: ' + e.message);
                log(e.stack || '');
            }
        }

        main();
    </script>
</body>
</html>
